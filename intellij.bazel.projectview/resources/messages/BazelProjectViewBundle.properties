bazel.language.projectview.description=ProjectView file for Bazel project
bazel.language.projectview.docs.allow_manual_targets_sync=If this option is set to true, build targets labeled with the manual tag can be synced which will enable running and debugging them. Enabling this option will implicitly enable the <code>shard_sync</code> option to allow labels expansion for Bazel query especially in cases where <code>derive_targets_from_directories</code> is disabled.
bazel.language.projectview.docs.bazel_binary=Specifies the path to a specific Bazel binary to be used in this project.
bazel.language.projectview.docs.build_flags=A set of flags that get passed to all build command invocations as arguments. This includes both sync and run configuration actions.
bazel.language.projectview.docs.debug_flags=A set of flags that get passed as arguments to all run and test commands invocations in debug mode.
bazel.language.projectview.docs.derive_targets_from_directories=If set to true, relevant project targets will be automatically derived from the directories during sync. Note that directories from all transitive imports are included.
bazel.language.projectview.docs.directories=A list of directories to include in your project. All files in the given directories will be indexed (allowing you to search for them) and listed in the Project tool window. If a file is not included in your project, it will have a yellow tab, and you will see a warning when attempting to edit it.
bazel.language.projectview.docs.dot_idea_directory_location=Specifies where the IntelliJ IDEA puts the .idea directory of the project. The path is relative to the workspace root. The directory does not have to exist yet.
bazel.language.projectview.docs.gazelle_target=Specifies a Gazelle target that IntelliJ IDEA runs automatically at the start of each Bazel sync.
bazel.language.projectview.docs.import_depth=Specifies how many levels of Bazel targets' dependencies should be imported as modules. Only the targets that are present in the workspace are imported. You can use a negative value to import all transitive dependencies. The default value is -1, meaning that all transitive context is included.
bazel.language.projectview.docs.import_run_configurations=A list of XML files which will be imported as run configurations during Bazel sync. By default, these run configurations will be updated during sync to match any changes to the XML.
bazel.language.projectview.docs.index_additional_files_in_directories=List of filenames to index in addition to sources, resources, and libraries defined in the project. The filenames are scanned inside directories defined in the directories: section. This speeds up searching for these files and can be needed for custom plugins to work on them. Has no effect if <code>index_all_files_in_directories</code> is set to true.
bazel.language.projectview.docs.index_all_files_in_directories=Whether to index all files inside the <code>directories</code> section or just the sources of the targets.
bazel.language.projectview.docs.python_debug_flags=A set of flags that get passed as arguments to run and test commands invocations in debug mode. These flags are only used when the Python support is enabled.They are added after flags specified in <code>debug_flags</code> section (in case of duplicates <code>python_debug_flags</code> have higher priority).
bazel.language.projectview.docs.run_config_run_with_bazel=If enabled, will invoke Bazel for running. This means the Bazel lock is consumed and run configurations can't be run in parallel. This also means JVM languages don't get native IDEA coverage experience. The advantage is that Bazel test result caching and/or Remote build execution (RBE) can be used. Note: this setting is ignored when debugging/profiling. The default is "true".
bazel.language.projectview.docs.shard_sync=Directs the plugin to shard Bazel build invocations when syncing and compiling your project. Bazel builds for sync may be sharded even if this is set to false, to keep the build command under the maximum command length (ARG_MAX).
bazel.language.projectview.docs.sharding_approach=Sharding approach to use for the build, can be: <code>expand_and_shard</code>, <code>query_and_shard</code>, <code>shard_only</code>.
bazel.language.projectview.docs.sync_flags=A set of flags that get passed to build during all sync actions. Unlike <code>build_flags</code>, these are not used for run configurations, so use <code>sync_flags</code> only when necessary, as they can defeat caching.
bazel.language.projectview.docs.target_shard_size=Number of targets per build shard.
bazel.language.projectview.docs.targets=A list of Bazel target expressions. To resolve source files under an imported directory, the source must be reachable from one of your targets. Because these are full Bazel target expressions, they support /... notation.
bazel.language.projectview.docs.test_flags=A set of flags that get passed to all test command invocations as arguments.
bazel.language.projectview.docs.test_sources=A list of workspace-relative glob patterns matching directories. Determines which sources IntelliJ treats as tests.
